# Vydání přes Release Please (ADR-003). Každý push na master aktualizuje release PR (verze a CHANGELOG z Conventional
# Commits). Merge release PR vytvoří tagy a GitHub Releases a stejný běh pak vydá eet2-core na npm a eet2-signing-service
# jako Docker image. Tagy vytvořené přes GITHUB_TOKEN by samostatný workflow nespustily, proto vše v jednom.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  IMAGE: ghcr.io/ma-zal/eet2-signing-service

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      core: ${{ steps.rp.outputs['packages/core--release_created'] }}
      core_version: ${{ steps.rp.outputs['packages/core--version'] }}
      service: ${{ steps.rp.outputs['packages/signing-service--release_created'] }}
      service_version: ${{ steps.rp.outputs['packages/signing-service--version'] }}
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Nic se nevydá bez zelených testů. Release PR od GITHUB_TOKEN nespouští ci.yml.
  verify:
    needs: release-please
    if: needs.release-please.outputs.core == 'true' || needs.release-please.outputs.service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  npm:
    needs: [release-please, verify]
    if: needs.release-please.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) a provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w eet2-core

      # Primárně trusted publishing (OIDC). Secret NPM_TOKEN je jen záloha, např. pro první vydání.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish -w eet2-core

  docker:
    needs: [release-please, verify]
    if: needs.release-please.outputs.service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # X.Y.Z, X.Y, X a latest. Pro 0.x bez tagu X: minor verze může být nekompatibilní, pinuje se 0.Y (ADR-003).
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.service_version }}
        run: |
          IFS=. read -r major minor _ <<< "$VERSION"
          tags="$IMAGE:$VERSION,$IMAGE:$major.$minor,$IMAGE:latest"
          if [ "$major" != "0" ]; then
            tags="$tags,$IMAGE:$major"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm up cache with native amd64 build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.release-please.outputs.service_version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.service_version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Vydání z tagu na master (ADR-003): eet2-core@X.Y.Z → npm, eet2-signing-service@X.Y.Z → Docker image.
# Tagy vytváří `npx changeset git-tag`, pushuje je člověk. Postup vydání viz AGENTS.md.
name: Release

on:
  push:
    tags:
      - 'eet2-core@*'
      - 'eet2-signing-service@*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  IMAGE: ghcr.io/ma-zal/eet2-signing-service

jobs:
  # Tag na commit v master, verze v tagu = verze v package.json, zelené testy. Jinak se nic nevydá.
  verify:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          package="${tag%@*}"
          version="${tag##*@}"
          case "$package" in
            eet2-core) dir=packages/core ;;
            eet2-signing-service) dir=packages/signing-service ;;
            *) echo "::error::Tag $tag nepatří žádnému balíčku."; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $tag neukazuje na commit v master."
            exit 1
          fi
          actual="$(node -p "require('./$dir/package.json').version")"
          if [ "$actual" != "$version" ]; then
            echo "::error::Verze v tagu $tag neodpovídá $dir/package.json ($actual)."
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  npm:
    needs: verify
    if: needs.verify.outputs.package == 'eet2-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing (OIDC) a provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w eet2-core

      # Primárně trusted publishing (OIDC). Secret NPM_TOKEN je jen záloha, např. pro první vydání.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish -w eet2-core

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/changelog-section.mjs packages/core/CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  docker:
    needs: verify
    if: needs.verify.outputs.package == 'eet2-signing-service'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # X.Y.Z, X.Y, X a latest. Pro 0.x bez tagu X: minor verze může být nekompatibilní, pinuje se 0.Y (ADR-003).
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          IFS=. read -r major minor _ <<< "$VERSION"
          tags="$IMAGE:$VERSION,$IMAGE:$major.$minor,$IMAGE:latest"
          if [ "$major" != "0" ]; then
            tags="$tags,$IMAGE:$major"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm up cache with native amd64 build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/changelog-section.mjs packages/signing-service/CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
